version: "3.9"

# A股每日选股 + 盘中实时盯盘（云服务器 Docker 版）
# 网页/盯盘页： http://服务器IP:8235/intraday
# 盯盘：交易日由宿主机 crontab 定时 docker start ashare-monitor，15:10 自动退出

services:
  web:
    image: ashare-picker
    container_name: ashare-web
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8235:8235"
    volumes:
      - ashare_data:/app/daily_picker/cache
    environment:
      - TZ=Asia/Shanghai
      - ASTOCK_PUSH_WEBHOOK=${ASTOCK_PUSH_WEBHOOK:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_AUTH_CODE=${SMTP_AUTH_CODE:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
    command: ["python", "webapp.py", "--host", "0.0.0.0", "--port", "8235"]

  monitor:
    image: ashare-picker
    container_name: ashare-monitor
    restart: "no"
    volumes:
      - ashare_data:/app/daily_picker/cache
    environment:
      - TZ=Asia/Shanghai
      - ASTOCK_PUSH_WEBHOOK=${ASTOCK_PUSH_WEBHOOK:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_AUTH_CODE=${SMTP_AUTH_CODE:-}
      - ALERT_EMAIL=${ALERT_EMAIL:-}
    command: ["python", "scripts/intraday_monitor.py", "--watch", "--interval", "10"]

volumes:
  ashare_data:
